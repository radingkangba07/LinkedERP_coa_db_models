name: CI & Deploy Migrations to Testing

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  UV_PYTHON: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  DATABASE_URL: "postgresql+asyncpg://coa_user:coa_pass@localhost:5432/coa_migration_test"

concurrency:
  group: deploy-testing-db
  cancel-in-progress: true

jobs:
  # ── Step 1: Test migrations (upgrade + downgrade) against a fresh DB ──
  test-migrations:
    name: Test migrations (upgrade ↑ downgrade ↓)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: coa_user
          POSTGRES_PASSWORD: coa_pass
          POSTGRES_DB: coa_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coa_user -d coa_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "migrations"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Upgrade to head
        run: uv run alembic upgrade head

      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Re-upgrade to head (sanity check)
        run: uv run alembic upgrade head

  # ── Step 2: Deploy migrations to the testing database ──────────────
  deploy-migrations:
    name: Deploy migrations to testing
    needs: test-migrations
    runs-on: ubuntu-latest
    environment:
      name: testing

    steps:
      - name: Run migrations on testing DB via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_REF: ${{ github.event.pull_request.head.ref || 'develop' }}
          GH_PAT: ${{ secrets.GH_PAT_COA_DB_MODELS }}
          DATABASE_URL: ${{ secrets.TESTING_DATABASE_URL }}
        with:
          host: ${{ secrets.TESTING_SSH_HOST }}
          username: ${{ secrets.TESTING_SSH_USER }}
          key: ${{ secrets.TESTING_SSH_KEY }}
          envs: DB_REF,GH_PAT,DATABASE_URL
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "Deploying db migrations from ref: ${DB_REF}"

            DB_MODELS_DIR=/opt/coa-migration/environments/testing/coa-db-models
            if [ ! -d "${DB_MODELS_DIR}/.git" ]; then
              git clone "https://${GH_PAT}@github.com/bhavna-linkedrp/coa-db-models..git" "${DB_MODELS_DIR}"
            fi

            cd "${DB_MODELS_DIR}"
            git fetch origin
            git reset --hard "origin/${DB_REF}"

            # Ensure uv is available
            if ! command -v uv &> /dev/null; then
              echo "Installing uv..."
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
            fi

            # Install/update dependencies and run migrations
            export DATABASE_URL="${DATABASE_URL}"
            uv sync --dev
            uv run alembic upgrade head
            echo "Migrations applied successfully."
