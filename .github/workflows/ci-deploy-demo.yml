name: CI & Deploy Migrations to Demo

on:
  pull_request:
    branches: [demo]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  UV_PYTHON: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache
  DATABASE_URL: "postgresql+asyncpg://coa_user:coa_pass@localhost:5432/coa_migration_test"

concurrency:
  group: deploy-demo-db
  cancel-in-progress: true

jobs:
  # ── Step 1: Test migrations (upgrade + downgrade) against a fresh DB ──
  test-migrations:
    name: Test migrations (upgrade ↑ downgrade ↓)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: coa_user
          POSTGRES_PASSWORD: coa_pass
          POSTGRES_DB: coa_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coa_user -d coa_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "migrations"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Upgrade to head
        run: uv run alembic upgrade head

      - name: Downgrade to base
        run: uv run alembic downgrade base

      - name: Re-upgrade to head (sanity check)
        run: uv run alembic upgrade head

  # ── Step 2: Deploy migrations to the demo database ─────────────────
  deploy-migrations:
    name: Deploy migrations to demo
    needs: test-migrations
    runs-on: ubuntu-latest
    environment:
      name: demo

    steps:
      - name: Run migrations on demo DB via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_REF: ${{ github.event.pull_request.head.ref || 'demo' }}
          GH_PAT: ${{ secrets.GH_PAT_COA_DB_MODELS }}
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          envs: DB_REF,GH_PAT
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "Deploying db migrations from ref: ${DB_REF}"

            ENV_DIR=/opt/coa-migration/environments/demo
            DB_MODELS_DIR="${ENV_DIR}/coa-db-models"

            if [ ! -d "${DB_MODELS_DIR}/.git" ]; then
              git clone "https://${GH_PAT}@github.com/bhavna-linkedrp/coa-db-models.git" "${DB_MODELS_DIR}"
            fi

            cd "${DB_MODELS_DIR}"
            git fetch origin
            git reset --hard "origin/${DB_REF}"

            # Run alembic inside the Docker network so it can reach the
            # postgres service. Mount the coa-db-models checkout and
            # use the same DATABASE_URL as the backend (from .env.demo).
            docker run --rm \
              --network coa-demo_coa-demo \
              -v "${DB_MODELS_DIR}:/app" \
              -w /app \
              --env-file "${ENV_DIR}/.env.demo" \
              ghcr.io/astral-sh/uv:python3.13-alpine \
              sh -c "uv sync --dev && uv run alembic upgrade head"

            echo "Migrations applied successfully."
