[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coa-db-models"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["coa_db_models"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
