[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coa-db-models"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "pgvector>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["coa_db_models"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "alembic>=1.15",
    "asyncpg>=0.30",
    "python-dotenv>=1.0",
    { include-group = "loader" },
]
# catalog_loader/ (repository root, not part of the wheel): loads ERP catalogue snapshots.
loader = [
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
